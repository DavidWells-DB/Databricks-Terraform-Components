name: Release tag check

# Runs on every tag push matching the per-component pattern <component>/vX.Y.Z.
# Enforces two rules from RELEASING.md:
#   1. The pushed tag must have a matching ## [X.Y.Z] entry in the component's CHANGELOG.md.
#   2. The tag must be a new ref (not a force-move of an existing published tag).
#
# GitHub also supports denying force-pushes to tag refs at the repo settings level
# (Settings → Rules → refs/tags/** → Restrict deletions + Block force pushes) —
# enable that as the primary guard; this workflow is the secondary code-level check.

on:
  push:
    tags:
      - '*/v[0-9]*.[0-9]*.[0-9]*'   # matches any <component>/vX.Y.Z (arbitrary depth)

permissions:
  contents: read

jobs:
  release-check:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG entry matches tag version
        run: |
          bash scripts/check-release-tag.sh "${{ steps.tag.outputs.tag }}"

      - name: Check tag is not a force-move
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PUSHED_SHA="${{ github.sha }}"
          EXISTING=$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')
          if [[ -n "$EXISTING" && "$EXISTING" != "$PUSHED_SHA" ]]; then
            echo "ERROR: Tag '${TAG}' already existed at ${EXISTING}." >&2
            echo "       Force-moving published tags is prohibited (RELEASING.md)." >&2
            exit 3
          fi
          echo "OK: Tag '${TAG}' is a new ref (not a force-move)."
